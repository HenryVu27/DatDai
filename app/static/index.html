<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Van Luat Dat Dai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --parchment: #f5f0e8;
  --parchment-deep: #ebe4d4;
  --ink: #2c2416;
  --ink-light: #5a4e3c;
  --ink-faint: #8a7e6c;
  --vermillion: #c0392b;
  --vermillion-soft: #e74c3c22;
  --gold: #b8860b;
  --gold-soft: #b8860b18;
  --cream: #faf8f3;
  --shadow: rgba(44, 36, 22, 0.08);
  --shadow-deep: rgba(44, 36, 22, 0.15);
}

html, body {
  height: 100%;
  font-family: 'Source Serif 4', Georgia, serif;
  background: var(--parchment);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(ellipse at 20% 0%, var(--gold-soft) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, var(--vermillion-soft) 0%, transparent 50%);
}

/* Header */
header {
  text-align: center;
  padding: 2rem 1.5rem 1.5rem;
  border-bottom: 1px solid var(--parchment-deep);
  position: relative;
  flex-shrink: 0;
}

header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: var(--vermillion);
}

header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(1.4rem, 3.5vw, 1.8rem);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  line-height: 1.2;
}

header p {
  font-size: 0.85rem;
  color: var(--ink-faint);
  margin-top: 0.4rem;
  font-style: italic;
}

/* Chat area */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  scroll-behavior: smooth;
}

#chat-area::-webkit-scrollbar { width: 6px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb { background: var(--parchment-deep); border-radius: 3px; }

.message {
  max-width: 720px;
  margin: 0 auto 1.5rem;
  animation: fadeUp 0.35s ease-out both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  display: flex;
  justify-content: flex-end;
}

.message.user .bubble {
  background: var(--ink);
  color: var(--cream);
  border-radius: 16px 16px 4px 16px;
  padding: 0.8rem 1.1rem;
  max-width: 80%;
  font-size: 0.95rem;
  line-height: 1.55;
  box-shadow: 0 2px 8px var(--shadow-deep);
}

.message.assistant .bubble {
  background: var(--cream);
  border: 1px solid var(--parchment-deep);
  border-radius: 4px 16px 16px 16px;
  padding: 1.2rem 1.4rem;
  font-size: 0.95rem;
  line-height: 1.7;
  box-shadow: 0 1px 4px var(--shadow);
  position: relative;
}

.message.assistant .bubble::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--vermillion), var(--gold));
  border-radius: 3px 0 0 3px;
}

/* Markdown-like formatting in answers */
.bubble p { margin-bottom: 0.6em; }
.bubble p:last-child { margin-bottom: 0; }
.bubble strong { font-weight: 600; color: var(--vermillion); }
.bubble ul, .bubble ol { margin: 0.4em 0 0.6em 1.4em; }
.bubble li { margin-bottom: 0.3em; }
.bubble code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85em;
  background: var(--parchment);
  padding: 0.1em 0.35em;
  border-radius: 3px;
}

/* Sources */
.sources {
  margin-top: 1rem;
  padding-top: 0.8rem;
  border-top: 1px dashed var(--parchment-deep);
}

.sources-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-faint);
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.source-tag {
  display: inline-block;
  font-size: 0.78rem;
  background: var(--gold-soft);
  border: 1px solid #b8860b30;
  color: var(--ink-light);
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  margin: 0 0.3rem 0.3rem 0;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
}

/* Typing indicator */
.typing {
  display: flex;
  gap: 5px;
  padding: 0.8rem 1.2rem;
  align-items: center;
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--ink-faint);
  border-radius: 50%;
  animation: typingDot 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingDot {
  0%, 60%, 100% { opacity: 0.25; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1); }
}

/* Input area */
#input-area {
  flex-shrink: 0;
  padding: 1rem 1.5rem 1.5rem;
  border-top: 1px solid var(--parchment-deep);
  background: linear-gradient(0deg, var(--parchment) 60%, transparent);
}

#input-form {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: 0.6rem;
  align-items: flex-end;
}

#question-input {
  flex: 1;
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 0.95rem;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--parchment-deep);
  border-radius: 12px;
  background: var(--cream);
  color: var(--ink);
  outline: none;
  resize: none;
  min-height: 48px;
  max-height: 140px;
  line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#question-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-soft);
}

#question-input::placeholder {
  color: var(--ink-faint);
  font-style: italic;
}

#send-btn {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 12px;
  background: var(--ink);
  color: var(--cream);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.1s;
  flex-shrink: 0;
}

#send-btn:hover { background: var(--ink-light); }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

#send-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Welcome state */
.welcome {
  max-width: 520px;
  margin: 3rem auto;
  text-align: center;
  animation: fadeUp 0.5s ease-out both;
}

.welcome-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 1.2rem;
  background: var(--gold-soft);
  border: 1.5px solid #b8860b30;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
}

.welcome h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.15rem;
  font-weight: 400;
  margin-bottom: 0.6rem;
  color: var(--ink);
}

.welcome p {
  font-size: 0.88rem;
  color: var(--ink-faint);
  line-height: 1.6;
  margin-bottom: 1.2rem;
}

.suggestions {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.suggestion {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 0.88rem;
  padding: 0.65rem 1rem;
  background: var(--cream);
  border: 1px solid var(--parchment-deep);
  border-radius: 10px;
  cursor: pointer;
  color: var(--ink-light);
  text-align: left;
  transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
}

.suggestion:hover {
  border-color: var(--gold);
  box-shadow: 0 1px 4px var(--shadow);
  color: var(--ink);
}

/* Mobile adjustments */
@media (max-width: 600px) {
  header { padding: 1.2rem 1rem 1rem; }
  #chat-area { padding: 1rem; }
  #input-area { padding: 0.8rem 1rem 1rem; }
  .message.assistant .bubble { padding: 1rem 1.1rem; }
}
</style>
</head>
<body>

<header>
  <h1>Tu Van Luat Dat Dai</h1>
  <p>Tra cuu van ban phap luat dat dai Viet Nam</p>
</header>

<div id="chat-area">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        <path d="M8 7h6"/>
        <path d="M8 11h8"/>
      </svg>
    </div>
    <h2>Ban can tu van ve phap luat dat dai?</h2>
    <p>Toi co the giup ban tra cuu Luat Dat Dai 2024 va cac nghi dinh huong dan, trich dan cu the dieu khoan lien quan.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="askSuggestion(this)">Dieu kien de duoc cap giay chung nhan quyen su dung dat la gi?</button>
      <button class="suggestion" onclick="askSuggestion(this)">Trinh tu thu tuc thu hoi dat de thuc hien du an?</button>
      <button class="suggestion" onclick="askSuggestion(this)">Nguoi nuoc ngoai co duoc mua dat tai Viet Nam khong?</button>
    </div>
  </div>
</div>

<div id="input-area">
  <form id="input-form" onsubmit="handleSubmit(event)">
    <textarea
      id="question-input"
      placeholder="Hoi ve luat dat dai..."
      rows="1"
      autofocus
    ></textarea>
    <button type="submit" id="send-btn" title="Gui cau hoi">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
  </form>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const form = document.getElementById('input-form');
const input = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome');

let history = [];
let isLoading = false;

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

// Enter to send, Shift+Enter for newline
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event('submit'));
  }
});

function askSuggestion(btn) {
  input.value = btn.textContent;
  form.dispatchEvent(new Event('submit'));
}

function addMessage(role, content, sources) {
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `message ${role}`;

  let html = `<div class="bubble">${formatContent(content)}`;

  if (sources && sources.length > 0) {
    html += `<div class="sources"><div class="sources-label">Nguon trich dan</div>`;
    sources.forEach(s => {
      let label = s.doc_name || '';
      if (s.dieu) label += ` - ${s.dieu}`;
      if (s.dieu_title) label += `. ${s.dieu_title}`;
      if (label) html += `<span class="source-tag">${escapeHtml(label)}</span>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  div.innerHTML = html;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function formatContent(text) {
  // Basic markdown-ish formatting
  let html = escapeHtml(text);
  // Bold: **text**
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Paragraphs
  html = html.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  return html;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

async function handleSubmit(e) {
  e.preventDefault();
  const question = input.value.trim();
  if (!question || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', question);
  addTyping();

  history.push({ role: 'user', content: question });

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history: history.slice(-6) }),
    });

    removeTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Loi server');
    }

    const data = await res.json();
    addMessage('assistant', data.answer, data.sources);
    history.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    removeTyping();
    addMessage('assistant', `Xin loi, da xay ra loi: ${err.message}. Vui long thu lai.`);
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
